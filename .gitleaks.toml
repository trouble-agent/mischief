# gitleaks config — extends the default ruleset with one repo-specific allowance.
[extend]
useDefault = true

# MSF-003 (SPEC-02 journal): internal/journal's scrub tests MUST embed
# credential-shaped strings (x-api-key values, token=...) — they are the
# synthetic fixtures proving scrub-on-write redacts them. They are fake
# values, never real credentials. Both the tier-2 judge (verdict c1c9aec4)
# and the builtin cross-check scanner confirmed the tree is otherwise clean.
[[allowlists]]
description = "synthetic credential fixtures in the scrubber's own tests"
paths = ['''^internal/journal/(journal|scrub)_test\.go$''']
