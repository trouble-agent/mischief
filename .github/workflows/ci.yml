# CI for mischief — go version follows go.mod (1.24).

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ["1.24"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go ${{ matrix.go-version }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        # The docker selftests (docker:pause/kill/oom) grade pass-or-skip
        # by daemon/image presence; TestLiveSelftestAllGreenOrSkip demands
        # the green set pass, so CI needs a local alpine:latest (never
        # pulled by the selftest itself).
        run: |
          docker pull alpine:latest
          go test -count=1 ./...
